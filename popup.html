<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸魚水族館 - 放置養魚遊戲</title>
    <style>
        html, body {
            width: 480px;
            height: 580px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #041226;
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
        }

        #gameFrame {
            width: 480px;
            height: 580px;
            border: 0;
            display: block;
            position: relative;
            z-index: 2;
        }

        .loading-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #81ecec;
            font-size: 14px;
            text-align: center;
            z-index: 1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(129, 236, 236, 0.2);
            border-top-color: #00cec9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="loading-placeholder">
        <div class="spinner"></div>
        <span>正在連線至摸魚水族館...</span>
    </div>
    <iframe id="gameFrame" src="https://youchiang.github.io/idle-fish-tank/" allow="autoplay"></iframe>
    <script src="popup.js"></script>
</body>
</html>
